[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyBluez"
version = "0.30"
description = "Bluetooth Python extension module"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["COPYING"]
authors = [{name = "Albert Huang", email = "ashuang@alum.mit.edu"}]
maintainers = [{name = "Piotr Karulis"}]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
]
# dependencies are platform-specific (pyobjc on macOS) and set in setup.py
dynamic = ["dependencies"]

[project.optional-dependencies]
ble = ["gattlib"]

[project.urls]
Homepage = "https://pybluez.github.io/"
Source = "https://github.com/pybluez/pybluez"
"Issue Tracker" = "https://github.com/pybluez/pybluez/issues"
